<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirmación RSVP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: transparent;
      font-family: 'Montserrat', sans-serif;
      color: #333;
      padding: 12px 12px 16px 12px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100%;
    }
    .form-card {
      width: 100%;
      max-width: 480px;
      background: transparent;
      padding: 4px;
    }
    .header-area {
      text-align: center;
      margin-bottom: 22px;
    }
    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #662334;
      margin-bottom: 8px;
      font-weight: 600;
      opacity: 0.85;
    }
    .main-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 46px;
      line-height: 1.05;
      color: #67212d;
      font-weight: 400;
      margin-bottom: 8px;
    }
    .main-title .cursive {
      font-style: italic;
      color: #67212d;
      font-weight: 500;
    }
    .subtitle {
      color: #662334;
      font-style: italic;
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      line-height: 1.35;
      opacity: 0.85;
    }
    .field-group {
      margin-bottom: 15px;
    }
    .field-label {
      display: block;
      font-size: 10.5px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #662334;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .field-row {
      display: flex;
      gap: 12px;
    }
    .field-col {
      flex: 1;
      min-width: 0;
    }
    input[type="text"],
    select,
    textarea {
      width: 100%;
      background: #fbf9f6;
      border: 1px solid #d9cfc5;
      border-radius: 4px;
      padding: 12px 14px;
      font-size: 13.5px;
      color: #44141e;
      font-family: 'Montserrat', sans-serif;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
    }
    input[type="text"]::placeholder,
    textarea::placeholder {
      color: #a4918a;
      font-size: 13px;
    }
    input[type="text"]:focus,
    select:focus,
    textarea:focus {
      border-color: #662334;
      box-shadow: 0 0 0 3px rgba(102, 35, 52, 0.12);
      background: #ffffff;
    }
    textarea {
      resize: vertical;
      min-height: 68px;
      line-height: 1.4;
    }
    .btn-submit {
      width: 100%;
      background: #662334;
      color: #f7f1e1;
      border: 1px solid #541926;
      border-radius: 4px;
      padding: 14px 24px;
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      letter-spacing: 0.18em;
      font-weight: 600;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 3px 10px rgba(102, 35, 52, 0.25);
      margin-top: 4px;
    }
    .btn-submit:hover {
      background: #4d1523;
      box-shadow: 0 5px 14px rgba(102, 35, 52, 0.35);
    }
    .btn-submit:active {
      transform: scale(0.99);
      background: #3a0d17;
    }
    .btn-submit svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
    .alert-box {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 4px;
      font-size: 12.5px;
      display: none;
      text-align: center;
      line-height: 1.4;
    }
    .alert-error {
      background: #fdf2f2;
      border: 1px solid #e8bebe;
      color: #67212d;
    }
    .alert-success {
      background: #f5efe8;
      border: 1px solid #d5c2b9;
      color: #662334;
    }
  </style>
</head>
<body>

  <div class="form-card">
    <div class="header-area">
      <div class="eyebrow">Confirma tu asistencia</div>
      <h1 class="main-title">¿<span class="cursive">Nos acompañas</span>?</h1>
      <p class="subtitle">Completa tus datos y envíanos la confirmación por WhatsApp.</p>
    </div>

    <form id="rsvpWhatsappForm" novalidate>
      <div class="field-group">
        <label class="field-label" for="nombreInput">Nombre Completo</label>
        <input type="text" id="nombreInput" name="nombre" placeholder="Tu nombre" required autocomplete="name">
      </div>

      <div class="field-group">
        <div class="field-row">
          <div class="field-col">
            <label class="field-label" for="asistenciaSelect">¿Asistirás?</label>
            <select id="asistenciaSelect" name="asistencia" required>
              <option value="" disabled selected>Selecciona</option>
              <option value="si">Sí, asistiré</option>
              <option value="no">No podré asistir</option>
            </select>
          </div>
          <div class="field-col">
            <label class="field-label" for="acompanantesSelect">Acompañantes</label>
            <select id="acompanantesSelect" name="acompanantes">
              <option value="0" selected>Solo yo (0)</option>
              <option value="1">+1 acompañante</option>
              <option value="2">+2 acompañantes</option>
              <option value="3">+3 acompañantes</option>
              <option value="4">+4 acompañantes</option>
            </select>
          </div>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="mensajeInput">Mensaje o Bendición</label>
        <textarea id="mensajeInput" name="mensaje" placeholder="Unas palabras para los novios..."></textarea>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">
        <span>Confirmar por WhatsApp</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19L19 5M19 5H9M19 5V15" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>

      <div id="alertBox" class="alert-box"></div>
    </form>
  </div>

  <script>
    // ==========================================
    // CONFIGURACIÓN: Número de WhatsApp destino
    // ==========================================
    const WHATSAPP_NUMERO = "51999999999"; 

    const form = document.getElementById('rsvpWhatsappForm');
    const alertBox = document.getElementById('alertBox');
    const btn = document.getElementById('btnSubmit');

    function showAlert(msg, isError) {
      alertBox.textContent = msg;
      alertBox.className = 'alert-box ' + (isError ? 'alert-error' : 'alert-success');
      alertBox.style.display = 'block';
    }

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      const nombre = document.getElementById('nombreInput').value.trim();
      const asistencia = document.getElementById('asistenciaSelect').value;
      const acompanantes = document.getElementById('acompanantesSelect').value;
      const mensaje = document.getElementById('mensajeInput').value.trim();

      if (!nombre) {
        showAlert('Por favor, ingresa tu nombre completo.', true);
        document.getElementById('nombreInput').focus();
        return;
      }

      if (!asistencia) {
        showAlert('Por favor, selecciona si asistirás al evento.', true);
        document.getElementById('asistenciaSelect').focus();
        return;
      }

      const txtAsistencia = asistencia === 'si' ? '¡Sí, confirmo mi asistencia! 💍' : 'Lamentablemente no podré asistir 🤍';
      const txtAcomp = asistencia === 'si' 
        ? (acompanantes === '0' ? 'Iré solo/a (0)' : `+${acompanantes} acompañante(s)`)
        : 'N/A';

      // 1. Guardar copia local en el servidor
      try {
        await fetch('/api/rsvp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nombre: nombre,
            asistencia: txtAsistencia,
            acompanantes: txtAcomp,
            mensaje: mensaje,
            fecha: new Date().toISOString()
          })
        });
      } catch (err) {
        console.warn('Registro local opcional no completado:', err);
      }

      // 2. Construir mensaje elegante de WhatsApp
      let msgWhatsApp = `¡Hola! Confirmo mi asistencia para la boda:\n\n`;
      msgWhatsApp += `*Nombre:* ${nombre}\n`;
      msgWhatsApp += `*¿Asistirá?:* ${txtAsistencia}\n`;
      if (asistencia === 'si') {
        msgWhatsApp += `*Acompañantes:* ${txtAcomp}\n`;
      }
      if (mensaje) {
        msgWhatsApp += `*Mensaje:* ${mensaje}\n`;
      }

      showAlert('¡Datos validados! Abriendo WhatsApp para enviar la confirmación...', false);

      const encodedText = encodeURIComponent(msgWhatsApp);
      const urlWhatsApp = `https://api.whatsapp.com/send?phone=${WHATSAPP_NUMERO}&text=${encodedText}`;

      setTimeout(() => {
        if (window.top && window.top !== window.self) {
          window.top.location.href = urlWhatsApp;
        } else {
          window.location.href = urlWhatsApp;
        }
      }, 700);
    });
  </script>
</body>
</html>
