<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirmación RSVP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      overflow: hidden !important;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }
    body {
      background-color: transparent;
      font-family: 'Montserrat', sans-serif;
      color: #333;
      padding: 6px 12px 10px 12px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .form-card {
      width: 100%;
      max-width: 480px;
      background: transparent;
      padding: 2px;
    }
    .header-area {
      text-align: center;
      margin-bottom: 14px;
    }
    .eyebrow {
      font-size: 10.5px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #662334;
      margin-bottom: 4px;
      font-weight: 600;
      opacity: 0.85;
    }
    .main-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 40px;
      line-height: 1.05;
      color: #67212d;
      font-weight: 400;
      margin-bottom: 4px;
    }
    .main-title .cursive {
      font-style: italic;
      color: #67212d;
      font-weight: 500;
    }
    .subtitle {
      color: #662334;
      font-style: italic;
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px;
      line-height: 1.25;
      opacity: 0.85;
    }
    .field-group {
      margin-bottom: 11px;
    }
    .field-label {
      display: block;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #662334;
      font-weight: 600;
      margin-bottom: 5px;
    }
    .field-row {
      display: flex;
      gap: 12px;
    }
    .field-col {
      flex: 1;
      min-width: 0;
    }
    input[type="text"],
    select,
    textarea {
      width: 100%;
      background: #fbf9f6;
      border: 1px solid #d9cfc5;
      border-radius: 4px;
      padding: 9px 12px;
      font-size: 13px;
      color: #44141e;
      font-family: 'Montserrat', sans-serif;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
    }
    input[type="text"]::placeholder,
    textarea::placeholder {
      color: #a4918a;
      font-size: 12.5px;
    }
    input[type="text"]:focus,
    select:focus,
    textarea:focus {
      border-color: #662334;
      box-shadow: 0 0 0 3px rgba(102, 35, 52, 0.12);
      background: #ffffff;
    }
    textarea {
      resize: none;
      height: 52px;
      min-height: 52px;
      max-height: 52px;
      line-height: 1.35;
    }
    .btn-submit {
      width: 100%;
      background: #662334;
      color: #f7f1e1;
      border: 1px solid #541926;
      border-radius: 4px;
      padding: 12px 20px;
      font-family: 'Montserrat', sans-serif;
      font-size: 11.5px;
      letter-spacing: 0.18em;
      font-weight: 600;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 3px 10px rgba(102, 35, 52, 0.25);
      margin-top: 4px;
    }
    .btn-submit:hover {
      background: #4d1523;
      box-shadow: 0 5px 14px rgba(102, 35, 52, 0.35);
    }
    .btn-submit:active {
      transform: scale(0.99);
      background: #3a0d17;
    }
    .btn-submit svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }
    .alert-box {
      margin-top: 8px;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      display: none;
      text-align: center;
      line-height: 1.35;
    }
    .alert-error {
      background: #fdf2f2;
      border: 1px solid #e8bebe;
      color: #67212d;
    }
    .alert-success {
      background: #f5efe8;
      border: 1px solid #d5c2b9;
      color: #662334;
    }
  </style>
</head>
<body>

  <div class="form-card">
    <div class="header-area">
      <div class="eyebrow">Confirma tu asistencia</div>
      <h1 class="main-title">¿<span class="cursive">Nos acompañas</span>?</h1>
      <p class="subtitle">Completa tus datos y envíanos la confirmación por WhatsApp.</p>
    </div>

    <form id="rsvpWhatsappForm" novalidate>
      <div class="field-group">
        <label class="field-label" for="nombreInput">Nombre Completo</label>
        <input type="text" id="nombreInput" name="nombre" placeholder="Tu nombre" required autocomplete="name">
      </div>

      <div class="field-group">
        <div class="field-row">
          <div class="field-col">
            <label class="field-label" for="asistenciaSelect">¿Asistirás?</label>
            <select id="asistenciaSelect" name="asistencia" required>
              <option value="" disabled selected>Selecciona</option>
              <option value="si">Sí, asistiré</option>
              <option value="no">No podré asistir</option>
            </select>
          </div>
          <div class="field-col">
            <label class="field-label" for="acompanantesSelect">Acompañantes</label>
            <select id="acompanantesSelect" name="acompanantes">
              <option value="0" selected>Solo yo (0)</option>
              <option value="1">+1 acompañante</option>
              <option value="2">+2 acompañantes</option>
              <option value="3">+3 acompañantes</option>
              <option value="4">+4 acompañantes</option>
            </select>
          </div>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="mensajeInput">Mensaje o Bendición</label>
        <textarea id="mensajeInput" name="mensaje" placeholder="Unas palabras para los novios..."></textarea>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">
        <span>Confirmar por WhatsApp</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19L19 5M19 5H9M19 5V15" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>

      <div id="alertBox" class="alert-box"></div>
    </form>
  </div>

  <script>
    // ==========================================
    // CONFIGURACIÓN: Número de WhatsApp destino
    // ==========================================
    const WHATSAPP_NUMERO = "51999999999"; 

    const form = document.getElementById('rsvpWhatsappForm');
    const nombreInput = document.getElementById('nombreInput');
    const asistenciaSelect = document.getElementById('asistenciaSelect');
    const acompanantesSelect = document.getElementById('acompanantesSelect');
    const mensajeInput = document.getElementById('mensajeInput');
    const alertBox = document.getElementById('alertBox');

    function showAlert(msg, isError = false) {
      alertBox.textContent = msg;
      alertBox.className = 'alert-box ' + (isError ? 'alert-error' : 'alert-success');
      alertBox.style.display = 'block';
    }

    function clearAlert() {
      alertBox.style.display = 'none';
      alertBox.textContent = '';
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      clearAlert();

      const nombre = nombreInput.value.trim();
      const asistencia = asistenciaSelect.value;
      const acompanantes = acompanantesSelect.value;
      const mensaje = mensajeInput.value.trim();

      if (!nombre) {
        showAlert('Por favor ingresa tu nombre completo.', true);
        nombreInput.focus();
        return;
      }

      if (!asistencia) {
        showAlert('Por favor indica si podrás acompañarnos.', true);
        asistenciaSelect.focus();
        return;
      }

      const textoAsistencia = (asistencia === 'si') ? '✅ SÍ, CONFIRMO MI ASISTENCIA' : '❌ LO SIENTO, NO PODRÉ ASISTIR';
      const textoAcomp = (asistencia === 'si') 
        ? (acompanantes === '0' ? 'Solo yo (sin acompañantes)' : '+' + acompanantes + ' acompañante(s)')
        : 'N/A';

      let textoWhatsApp = '💒 *CONFIRMACIÓN DE ASISTENCIA - BODA*\n\n';
      textoWhatsApp += '*Nombre:* ' + nombre + '\n';
      textoWhatsApp += '*Respuesta:* ' + textoAsistencia + '\n';
      if (asistencia === 'si') {
        textoWhatsApp += '*Acompañantes:* ' + textoAcomp + '\n';
      }
      if (mensaje) {
        textoWhatsApp += '*Mensaje:* ' + mensaje + '\n';
      }
      textoWhatsApp += '\n¡Muchas gracias!';

      showAlert('¡Listo! Abriendo WhatsApp para enviar tu confirmación...', false);

      const urlWhatsApp = 'https://api.whatsapp.com/send?phone=' + WHATSAPP_NUMERO + '&text=' + encodeURIComponent(textoWhatsApp);

      // Guardar también copia local por respaldo
      try {
        fetch('/api/rsvp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nombre: nombre,
            asistencia: asistencia,
            acompanantes: acompanantes,
            mensaje: mensaje,
            fecha: new Date().toISOString()
          })
        }).catch(function(){});
      } catch(err){}

      setTimeout(function() {
        window.open(urlWhatsApp, '_blank');
      }, 700);
    });
  </script>
</body>
</html>
